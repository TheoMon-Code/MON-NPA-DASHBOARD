<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NPA KPI Dashboard — NPA KPI</title>
<link rel="icon" href="data:image/x-icon;base64,AAABAAEAAQEAAAEAGAAwAAAAFgAAACgAAAABAAAAAgAAAAEAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIuv6QAAAAA=">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --blue1:#006EAF; --blue2:#4EB2E5; --blue3:#004990;
  --green:#1E8A55; --green-bg:#E6F4EE;
  --amber:#B87200; --amber-bg:#FBF3E0;
  --red:#D31A2B;   --red-bg:#FDEAEC;
  --text:#1D1D1B;  --text2:#4A6070; --text3:#8AAABB;
  --border:#D4E8F5; --bg:#F2F8FC; --card:#fff;
}
body { min-height:100vh; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }

/* ── HEADER ── */
.hdr {
  background: linear-gradient(135deg, #EAF4FC 0%, #DCEEFB 55%, #CDE7FA 100%);
  padding: 0 40px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 10px rgba(0,73,144,0.10);
  border-bottom: 1px solid #C7DFF2;
}
.hdr-left  { display:flex; align-items:center; gap:16px; }
.hdr-right { display:flex; align-items:center; gap:12px; }
.hdr-logo-mon { height:34px; width:auto; }
.hdr-div  { width:1px; height:28px; background:rgba(0,73,144,0.18); }
.hdr-site { display:flex; flex-direction:column; gap:1px; }
.hdr-site-label { font-size:9px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:rgba(0,73,144,0.55); }
.hdr-site-name  { font-size:13px; font-weight:600; color:#04355E; }
.hdr-logo-purina { height:40px; width:auto; }
.hdr-back { display:flex; align-items:center; gap:5px; font-size:12px; font-weight:500; color:rgba(0,73,144,0.7); text-decoration:none; padding:5px 12px; border-radius:5px; border:1px solid rgba(0,73,144,0.22); transition:all 0.15s; }
.hdr-back:hover { background:rgba(0,73,144,0.08); color:#004990; }
.lang-wrap { display:flex; background:rgba(0,73,144,0.08); border-radius:20px; padding:2px; }
.lang-btn { font-size:10px; font-weight:700; letter-spacing:1px; padding:4px 10px; border-radius:20px; color:rgba(0,73,144,0.5); cursor:pointer; border:none; background:transparent; }
.lang-btn.on { background:rgba(0,73,144,0.18); color:#004990; }
.timer-bar { width:60px; height:2px; background:rgba(0,73,144,0.12); border-radius:1px; overflow:hidden; }
.timer-fill { height:100%; background:rgba(0,73,144,0.45); border-radius:1px; }
.live { display:flex; align-items:center; gap:5px; font-size:10px; font-weight:700; color:#1E8A55; letter-spacing:1px; }
.live-dot { width:7px; height:7px; background:#1E8A55; border-radius:50%; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
.clock { font-size:16px; font-weight:400; color:#04355E; letter-spacing:2px; min-width:75px; text-align:right; }
.clock-date { font-size:9px; color:rgba(0,73,144,0.5); text-align:right; margin-top:1px; }

/* ── STAT PILLS ── */
.stats { display:flex; gap:6px; }
.spill { display:flex; flex-direction:column; align-items:center; padding:3px 10px; border-radius:5px; background:rgba(0,73,144,0.06); border:1px solid rgba(0,73,144,0.14); min-width:46px; }
.spill-val { font-size:14px; font-weight:600; color:#04355E; line-height:1; }
.spill-val.g { color:#1E8A55; }
.spill-val.a { color:#B87200; }
.spill-val.r { color:#D31A2B; }
.spill-lbl { font-size:8px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:rgba(0,73,144,0.5); margin-top:2px; }

/* ── BODY ── */
.body { flex:1; padding:24px 48px; display:flex; flex-direction:column; gap:16px; }

/* ── SECTION LABEL ── */
.slabel { font-size:10px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--blue1); margin-bottom:10px; display:flex; align-items:center; gap:10px; }
.slabel::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── INDEX GRID ── */
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
.kcard { background:var(--card); border-radius:8px; border:1px solid var(--border); overflow:hidden; text-decoration:none; color:var(--text); transition:transform 0.12s,box-shadow 0.12s; display:flex; flex-direction:column; }
.kcard:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,110,175,0.1); }
.kcard-hdr { background:var(--blue1); padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start; }
.kcard-cat  { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.55); margin-bottom:2px; }
.kcard-name { font-size:14px; font-weight:500; color:#fff; line-height:1.2; }
.kcard-val  { font-size:24px; font-weight:300; color:#fff; letter-spacing:-0.5px; text-align:right; }
.kcard-val.ok   { color:#8DE8BC; }
.kcard-val.warn { color:#FFE082; }
.kcard-val.bad  { color:#EF9A9A; }
.kcard-val.info { color:#B3E5FC; }
.kcard-target { font-size:10px; color:rgba(255,255,255,0.5); text-align:right; margin-top:2px; }
.kcard-ftr { padding:8px 18px; display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:600; letter-spacing:0.5px; }
.kcard-ftr.ok   { background:var(--green-bg); color:var(--green); }
.kcard-ftr.warn { background:var(--amber-bg); color:var(--amber); }
.kcard-ftr.bad  { background:var(--red-bg);   color:var(--red); }
.kcard-ftr.info { background:#E3F2FD; color:var(--blue1); }

/* ── KPI PAGE ── */
.kpi-title-bar { background:var(--blue1); padding:14px 48px; display:flex; justify-content:space-between; align-items:center; }
.kpi-title-left { display:flex; flex-direction:column; gap:2px; }
.kpi-cat-lbl { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,0.5); }
.kpi-title   { font-size:22px; font-weight:300; color:#fff; }
.kpi-title strong { font-weight:600; }
.kpi-title-right { display:flex; align-items:center; gap:16px; }
.kpi-hero { text-align:right; }
.kpi-hero-val { font-size:44px; font-weight:300; color:#fff; letter-spacing:-2px; line-height:1; }
.kpi-hero-val.ok   { color:#8DE8BC; }
.kpi-hero-val.warn { color:#FFE082; }
.kpi-hero-val.bad  { color:#EF9A9A; }
.kpi-hero-val.info { color:#B3E5FC; }
.kpi-hero-lbl { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-top:2px; }
.kpi-status { display:inline-block; margin-top:5px; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; padding:3px 12px; border-radius:3px; }
.kpi-status.ok   { background:#1B6E3F; color:#8DE8BC; }
.kpi-status.warn { background:#8A4800; color:#FFD9A8; }
.kpi-status.bad  { background:#7A1020; color:#F5A0A8; }
.kpi-status.info { background:#0D4F7A; color:#A8D8F0; }

/* Info card */
.icard { background:var(--card); border-radius:8px; border:1px solid var(--border); padding:16px 20px; }
.irow  { display:flex; gap:8px; margin-bottom:5px; font-size:13px; line-height:1.4; }
.irow:last-child { margin-bottom:0; }
.ilbl  { font-weight:600; color:var(--blue1); flex-shrink:0; }
.itxt  { color:var(--text2); }

/* Chart */
.chart-card { background:var(--card); border-radius:8px; border:1px solid var(--border); padding:18px 20px; }
.chart-area { display:flex; align-items:flex-end; gap:4px; height:120px; padding-bottom:20px; }
.cbar-wrap  { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
.cbar { width:100%; border-radius:3px 3px 0 0; min-height:2px; position:relative; display:flex; justify-content:center; }
.cbar-lbl { font-size:11px; font-weight:600; position:absolute; top:-16px; color:var(--text); white-space:nowrap; }
.cbar.green { background:var(--green); }
.cbar.amber { background:var(--amber); }
.cbar.red   { background:var(--red); }
.cbar.blue  { background:var(--blue1); }
.cbar.empty { background:var(--border); }
.cbar-month { font-size:10px; color:var(--text3); text-align:center; margin-top:4px; }

/* Table */
.dtable { width:100%; border-collapse:collapse; font-size:13px; }
.dtable th { background:var(--blue1); color:#fff; padding:9px 14px; text-align:center; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
.dtable th:first-child { text-align:left; }
.dtable td { padding:8px 14px; text-align:center; border-bottom:1px solid var(--border); color:var(--text2); }
.dtable td:first-child { text-align:left; font-weight:500; color:var(--text); }
.dtable tr:nth-child(even) { background:#F8FCFE; }
.dtable tr:last-child td  { border-bottom:none; }
.td-g { color:var(--green); font-weight:600; }
.td-r { color:var(--red);   font-weight:600; }
.td-a { color:var(--amber); font-weight:600; }
.td-e { color:var(--border); }

/* VS strip */
.vstrip { background:var(--card); border-radius:8px; border:1px solid var(--border); border-top:2px solid var(--blue3); padding:12px 20px; display:flex; align-items:center; }
.vstrip-lbl { font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--blue3); white-space:nowrap; margin-right:20px; }
.vitems { display:flex; flex:1; }
.vitem  { flex:1; text-align:center; padding:0 6px; border-right:1px solid var(--border); }
.vitem:last-child { border-right:none; }
.vitem-n { font-size:10px; font-weight:600; color:var(--text3); margin-bottom:2px; }
.vitem-p { font-size:11px; color:var(--text3); margin-bottom:2px; }
.vitem-v { font-size:16px; font-weight:400; }
.vitem-v.up   { color:var(--green); }
.vitem-v.down { color:var(--red); }
.vitem-v.same { color:var(--text3); }

/* Loading */
.loader { position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(242,248,252,0.95); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999; }
.spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--blue1); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Footer */
.ftr { background:var(--blue3); padding:10px 48px; display:flex; justify-content:space-between; align-items:center; }
.ftr-txt { font-size:11px; color:rgba(255,255,255,0.4); }
.ftr-link { color:rgba(255,255,255,0.45); text-decoration:none; }
.ftr-link:hover { color:rgba(255,255,255,0.7); }

/* ── TV MODE ── */
.tv-btn { display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:rgba(0,73,144,0.7); background:rgba(0,73,144,0.08); border:1px solid rgba(0,73,144,0.22); border-radius:5px; padding:5px 10px; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
.tv-btn:hover { background:rgba(0,73,144,0.16); color:#004990; }
.tv-badge { position:fixed; top:16px; right:16px; background:#04355E; color:#fff; padding:8px 14px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:1px; display:flex; align-items:center; gap:8px; z-index:9999; box-shadow:0 4px 16px rgba(0,0,0,0.25); }
.tv-dot { width:8px; height:8px; background:#EF5350; border-radius:50%; animation:pulse 1.2s infinite; }
#tvCount { color:#8AAABB; font-weight:400; }
.tv-exit { background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:10px; font-weight:600; padding:3px 8px; border-radius:12px; cursor:pointer; }
.tv-exit:hover { background:rgba(255,255,255,0.28); }
body.tv-mode .hdr-back { visibility:hidden; }
body.tv-mode .tv-btn { display:none; }

/* ── SPARKLINE ── */
.kcard-spark { padding:6px 18px 4px; background:var(--card); }
.kcard-spark svg { width:100%; height:26px; display:block; }
</style>
</head>
<body>
<div class="loader" id="loader">
  <div class="spinner"></div>
  <div style="font-size:13px;color:#8AAABB;">กำลังโหลดข้อมูล...</div>
</div>

<div class="hdr">
  <div class="hdr-left">
    <img class="hdr-logo-mon" src="mon-logo.png" alt="MON">
    <div class="hdr-div"></div>
    <div class="hdr-site">
      <div class="hdr-site-label">Operated by / ดำเนินการโดย</div>
      <div class="hdr-site-name">Nestle Purina Thai — Amata Factory</div>
    </div>
    <div class="hdr-div"></div>
    <img class="hdr-logo-purina" src="purina-logo.png" alt="Purina">
    
  </div>
  <div class="hdr-right">
    <button class="tv-btn" onclick="startTVMode()" title="Start TV Mode">📺 TV</button>
    <div class="hdr-div"></div>
    <div class="stats">
      <div class="spill"><div class="spill-val g" id="s-ok">—</div><div class="spill-lbl">On Target</div></div>
      <div class="spill"><div class="spill-val a" id="s-warn">—</div><div class="spill-lbl">Monitor</div></div>
      <div class="spill"><div class="spill-val r" id="s-bad">—</div><div class="spill-lbl">Attention</div></div>
    </div>
    <div class="hdr-div"></div>
    <div class="timer-bar"><div class="timer-fill" id="tFill"></div></div>
    <div class="lang-wrap">
      <button class="lang-btn on" id="lTH" onclick="setLang('th')">TH</button>
      <button class="lang-btn"    id="lEN" onclick="setLang('en')">EN</button>
    </div>
    <div class="hdr-div"></div>
    <div class="live"><div class="live-dot"></div>LIVE</div>
    <div><div class="clock" id="clk">00:00:00</div><div class="clock-date" id="clkd">—</div></div>
  </div>
</div>
<div class="body">
  <div class="slabel" id="lbl-sp">Safety & People</div>
  <div class="grid" id="g-sp"></div>
  <div class="slabel" id="lbl-q">Quality & Accuracy</div>
  <div class="grid" id="g-q"></div>
  <div class="slabel" id="lbl-o">Operations & Efficiency</div>
  <div class="grid" id="g-o"></div>
</div>

<div class="ftr">
  <div class="ftr-txt" id="dt">—</div>
  <div class="ftr-txt">MON Logistics Group · NPA Amata Factory · <span id="period">—</span></div>
  <div class="ftr-txt"><a href="https://docs.google.com/spreadsheets/d/1Dr2jq7Hp00L_HKQfQ7eiSXCwSPf9riYCy5GRm7sGvzo" target="_blank" class="ftr-link">📊 Google Sheets</a></div>
</div>
<script>
var CSV_URL = 'https://docs.google.com/spreadsheets/d/1Dr2jq7Hp00L_HKQfQ7eiSXCwSPf9riYCy5GRm7sGvzo/export?format=csv&gid=0';
var MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MTH = {January:'มกราคม',February:'กุมภาพันธ์',March:'มีนาคม',April:'เมษายน',May:'พฤษภาคม',June:'มิถุนายน',July:'กรกฎาคม',August:'สิงหาคม',September:'กันยายน',October:'ตุลาคม',November:'พฤศจิกายน',December:'ธันวาคม'};
var LB  = ['Safety incidents','Property Damage','Complaints','Dispatch Errors','Care Compliance'];
var INF = ['Turnover Rate','Truck Turn'];
var currentLang = 'th';

function parseCSV(t) {
  var lines = t.trim().split('\n');
  var hdrs  = lines[0].split(',').map(function(h){ return h.trim().replace(/"/g,''); });
  var d = {};
  for (var i=1;i<lines.length;i++) {
    var cols = lines[i].split(',').map(function(c){ return c.trim().replace(/"/g,''); });
    if (!cols[0]) continue;
    d[cols[0]] = {};
    for (var j=1;j<hdrs.length;j++) d[cols[0]][hdrs[j]] = cols[j]||'';
  }
  return d;
}

function pv(v) {
  if (!v||v==='-'||v==='') return null;
  /* Normalize: remove %, replace comma decimal separator */
  var s = v.toString().trim();
  s = s.replace('%','');
  /* Handle both "97,85" (French) and "97.85" (English) decimal formats */
  /* If there's a comma and it looks like decimal (1-2 digits after), replace with dot */
  s = s.replace(/,([0-9]{1,2})$/, '.$1');
  /* Remove any remaining commas (thousands separator) */
  s = s.replace(/,/g, '');
  var n = parseFloat(s);
  return isNaN(n)?null:n;
}

function fv(v,unit) {
  if (v===null||v===undefined) return '—';
  if (unit==='%') return v.toFixed(2).replace('.',',')+'%';
  return (v%1===0)?String(v):v.toFixed(2);
}

function latest(kpi) {
  for (var i=11;i>=0;i--) { var v=pv(kpi[MN[i]]); if (v!==null) return {v:v,m:MN[i],i:i}; }
  return {v:null,m:'',i:-1};
}

function prev(kpi,li) {
  for (var i=li-1;i>=0;i--) { var v=pv(kpi[MN[i]]); if (v!==null) return {v:v,m:MN[i],i:i}; }
  return {v:null,m:'',i:-1};
}

function status(name,val,tgt) {
  if (INF.indexOf(name)>=0) return 'info';
  if (val===null||tgt===null) return 'info';
  var lb = LB.indexOf(name)>=0;
  if (lb) return val<=tgt?'ok':(val<=tgt*2||tgt===0&&val<=6?'warn':'bad');
  return val>=tgt?'ok':(val>=tgt*0.95?'warn':'bad');
}

var ST_LABELS = {
  th:{ok:'ผ่านเป้าหมาย',warn:'ต้องติดตาม',bad:'ต้องปรับปรุง',info:'ข้อมูลอ้างอิง'},
  en:{ok:'On Target',warn:'Monitor',bad:'Below Target',info:'Reference Only'}
};

/* Lang */
function setLang(lang) {
  currentLang = lang;
  document.getElementById('lTH').className = lang==='th'?'lang-btn on':'lang-btn';
  document.getElementById('lEN').className = lang==='en'?'lang-btn on':'lang-btn';
  document.body.style.fontFamily = lang==='th'?"'Sarabun','Inter',sans-serif":"'Inter','Helvetica Neue',sans-serif";
  if (typeof onLangChange === 'function') onLangChange(lang);
}

var TH_MS=75000,EN_MS=45000;
function startTimer(ms) {
  var f=document.getElementById('tFill');
  f.style.transition='none'; f.style.width='100%';
  setTimeout(function(){f.style.transition='width '+(ms/1000)+'s linear';f.style.width='0%';},50);
}
function cycleLang() {
  var nxt=currentLang==='th'?'en':'th';
  setLang(nxt);
  startTimer(nxt==='th'?TH_MS:EN_MS);
  setTimeout(cycleLang,nxt==='th'?TH_MS:EN_MS);
}
startTimer(TH_MS);
setTimeout(cycleLang,TH_MS);

/* Clock */
function tick() {
  var n=new Date();
  var el=document.getElementById('clk');
  if (el) el.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(function(x){return String(x).padStart(2,'0');}).join(':');
  var de=document.getElementById('clkd');
  if (de) de.textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  var dt=document.getElementById('dt');
  if (dt) dt.textContent=n.toLocaleDateString('th-TH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
setInterval(tick,1000); tick();
setTimeout(function(){location.reload();},3600000);

visor)", "cat": "sp", "file": "npa_grow_coaching_supervisor.html"}, {"row": "Manpower Fulfill Rate", "th": "Manpower Fulfill Rate", "en": "Manpower Fulfill Rate", "cat": "sp", "file": "npa_manpower_fulfill.html"}];
var GRIDS   = {sp:'g-sp',q:'g-q',o:'g-o'};
var allData = {};


function sparkline(vals, st) {
  var pts = vals.filter(function(v){ return v!==null; }).slice(-6);
  if (pts.length < 2) return '';
  var mn=Math.min.apply(null,pts), mx=Math.max.apply(null,pts);
  var rng = (mx-mn)||1;
  var w=100, h=26, step=w/(pts.length-1);
  var coords = pts.map(function(v,i){
    var x=i*step, y=h-((v-mn)/rng)*(h-4)-2;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  var colorMap={ok:'#1E8A55',warn:'#B87200',bad:'#D31A2B',info:'#006EAF'};
  var col = colorMap[st]||'#006EAF';
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+coords+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function renderIndex(data) {
  allData = data;
  var ok=0,warn=0,bad=0,period='';
  ['g-sp','g-q','g-o'].forEach(function(id){ document.getElementById(id).innerHTML=''; });

  KPI_CFG.forEach(function(c) {
    var kpi=data[c.row]||{};
    var L=latest(kpi), tgt=pv(kpi['Target']), unit=kpi['Unit']||'';
    var st=status(c.row,L.v,tgt);
    if(st==='ok') ok++; else if(st==='warn') warn++; else if(st==='bad') bad++;
    if(L.m&&!period) period=L.m;

    var raw=L.m?(kpi[L.m]||'—'):'—';
    var tgtNum=pv(kpi['Target']);
    var tstr=tgtNum!==null?(kpi['Target']+(unit&&unit!=='%'?' '+unit:'')):'—';
    var name=currentLang==='th'?c.th:c.en;
    var stlbl=(ST_LABELS[currentLang]||ST_LABELS.en)[st]||st;
    var hist=MN.map(function(m){return pv(kpi[m]);});
    var spark=sparkline(hist,st);

    var card='<a href="'+c.file+'" class="kcard">'+
      '<div class="kcard-hdr">'+
        '<div><div class="kcard-cat">NPA Amata</div><div class="kcard-name">'+name+'</div></div>'+
        '<div><div class="kcard-val '+st+'">'+raw+'</div><div class="kcard-target">Target: '+tstr+'</div></div>'+
      '</div>'+
      (spark?'<div class="kcard-spark">'+spark+'</div>':'')+
      '<div class="kcard-ftr '+st+'"><span>'+stlbl+'</span><span>→</span></div>'+
      '</a>';

    var g=document.getElementById(GRIDS[c.cat]);
    if(g) g.innerHTML+=card;
  });

  var s=document.getElementById('s-ok');   if(s) s.textContent=ok;
  var w=document.getElementById('s-warn'); if(w) w.textContent=warn;
  var b=document.getElementById('s-bad');  if(b) b.textContent=bad;

  if(period) {
    var mth=currentLang==='th'?(MTH[period]||period):period;
    var el=document.getElementById('period'); if(el) el.textContent=mth+' 2026';
  }
  var lo=document.getElementById('loader'); if(lo) lo.style.display='none';
}

function onLangChange(lang) {
  var labels={
    th:{sp:'Safety & People',q:'Quality & Accuracy',o:'Operations & Efficiency'},
    en:{sp:'Safety & People',q:'Quality & Accuracy',o:'Operations & Efficiency'}
  };
  var L=labels[lang];
  ['sp','q','o'].forEach(function(k){ var el=document.getElementById('lbl-'+k); if(el) el.textContent=L[k]; });
  if(Object.keys(allData).length) renderIndex(allData);
}

(function(){
  var TV_SEQ = ["index.html", "npa_safety.html", "npa_care_compliance.html", "npa_open_vacancy.html", "npa_turnover.html", "npa_damage.html", "npa_complaint.html", "npa_dispatch.html", "npa_ira.html", "npa_truck.html", "npa_because_we_care.html", "npa_safety_tag.html", "npa_near_miss.html", "npa_safer_easier.html", "npa_legal_compliance.html", "npa_grow_coaching_manager.html", "npa_grow_coaching_supervisor.html", "npa_manpower_fulfill.html"];
  var HOME_FILES = ["index.html", "npa_index.html"];
  function curFile(){ var p=location.pathname.split('/').pop(); return p||'index.html'; }
  function dwellMs(){ return HOME_FILES.indexOf(curFile())>=0 ? 10000 : 15000; }
  function goNext(){
    var idx=TV_SEQ.indexOf(curFile());
    var next=TV_SEQ[(idx+1)%TV_SEQ.length];
    location.href=next+'?tv=1';
  }
  function exitTV(){ location.href=location.pathname; }
  window.startTVMode=function(){ location.href=curFile()+'?tv=1'; };
  function fitToScreen(){
    document.body.style.zoom='';
    var full=document.documentElement.scrollHeight;
    var avail=window.innerHeight;
    if(!full||!avail) return;
    var ratio=avail/full;
    ratio=Math.min(1,Math.max(0.55,ratio));
    document.body.style.zoom=ratio;
  }
  function waitAndFit(){
    var tries=0;
    var iv=setInterval(function(){
      tries++;
      var lo=document.getElementById('loader');
      var loaded=!lo||lo.style.display==='none';
      if(loaded||tries>40){
        clearInterval(iv);
        setTimeout(fitToScreen,150);
      }
    },150);
  }
  var qs=new URLSearchParams(location.search);
  if(qs.get('tv')==='1'){
    document.body.classList.add('tv-mode');
    var wrap=document.createElement('div');
    wrap.id='tvBadge'; wrap.className='tv-badge';
    wrap.innerHTML='<span class="tv-dot"></span><span>TV MODE</span><span id="tvCount"></span><button id="tvExit" class="tv-exit">Exit \u2715</button>';
    document.body.appendChild(wrap);
    document.getElementById('tvExit').onclick=function(){exitTV();};
    var remain=Math.round(dwellMs()/1000);
    var cEl=document.getElementById('tvCount');
    if(cEl) cEl.textContent=remain+'s';
    var iv=setInterval(function(){
      remain--;
      if(cEl) cEl.textContent=Math.max(remain,0)+'s';
      if(remain<=0){ clearInterval(iv); goNext(); }
    },1000);
    waitAndFit();
    window.addEventListener('resize',fitToScreen);
  }
})();
</script>
